<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d&b audiotechnik Amp Calculator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            900: '#111827',
                            800: '#1f2937',
                            700: '#374151',
                            600: '#4b5563',
                            500: '#6b7280'
                        },
                        brand: {
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #111827;
            color: #f3f4f6;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        /* Custom Scrollbar for Visualizer */
        .visualizer-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .visualizer-scroll::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2); 
            border-radius: 4px;
        }
        .visualizer-scroll::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 4px;
        }
        .visualizer-scroll::-webkit-scrollbar-thumb:hover {
            background: #6b7280; 
        }

        /* Visualizer Elements */
        .flybar {
            width: 80px;
            height: 12px;
            background: #4b5563;
            border-radius: 2px 2px 0 0;
            margin: 0 auto 4px;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            align-items: center;
        }
        .flybar::after, .flybar::before {
            content: '';
            display: block;
            width: 4px;
            height: 4px;
            background: #111;
            border-radius: 50%;
        }
        .cabinet {
            background: linear-gradient(90deg, #1f2937 0%, #374151 50%, #1f2937 100%);
            border: 1px solid #111827;
            margin: 0 auto 2px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cabinet-grille {
            position: absolute;
            inset: 2px 4px;
            background: repeating-linear-gradient(45deg, rgba(17,24,39,0.5), rgba(17,24,39,0.5) 2px, transparent 2px, transparent 4px);
        }
        
        /* Cabinet Specific Sizes */
        .cabinet.line-array {
            width: 70px;
            height: 18px;
            clip-path: polygon(2% 0, 98% 0, 100% 100%, 0 100%);
        }
        .cabinet.sl-series {
            width: 78px;
            height: 20px;
            clip-path: polygon(2% 0, 98% 0, 100% 100%, 0 100%);
        }
        .cabinet.sub {
            width: 86px;
            height: 42px;
            margin-bottom: 4px;
            border-radius: 2px;
        }
        .cabinet.point-source {
            width: 40px;
            height: 46px;
            margin-bottom: 6px;
            border-radius: 2px;
        }
    </style>
</head>
<body class="antialiased min-h-screen pb-48">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // Constants & Data
        const CABINETS = {
            SL_SERIES: ['KSL8', 'KSL12', 'XSL8', 'XSL12', 'GSL8', 'GSL12'],
            STANDARD: ['V8', 'V12', 'Y8', 'Y12'],
            SUBS: ['SL-SUB', 'V-SUB', 'B2-SUB'],
            POINT_SOURCE: ['T10', 'Y10P', 'M4', 'M2']
        };

        const INVENTORY = {
            d40_6: { capacity: 6, available: 4, name: '6-High D40 Rack' },
            d90_3: { capacity: 3, available: 2, name: '3-High D90 Rack' },
            d20_3: { capacity: 3, available: 1, name: '3-High D20 Rack' },
            d20_1: { capacity: 1, available: 3, name: 'Single D20' }
        };

        // UI Icons
        const TrashIcon = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
        );
        const PlusIcon = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        );

        function App() {
            // Initial State mapping to decluttered UI requirements
            const [sources, setSources] = useState([
                { id: 1, name: 'Main L/R', cabinet: 'XSL8', quantity: 8, isAP: true, isLinked: false, isStereo: true },
                { id: 2, name: 'Subs', cabinet: 'SL-SUB', quantity: 4, isAP: false, isLinked: false, isStereo: false },
                { id: 3, name: 'Front Fills', cabinet: 'Y10P', quantity: 4, isAP: false, isLinked: false, isStereo: false }
            ]);

            const addSource = () => {
                setSources([...sources, { 
                    id: Date.now(), 
                    name: `Source ${sources.length + 1}`, 
                    cabinet: 'V8', 
                    quantity: 4, 
                    isAP: false,
                    isLinked: false,
                    isStereo: false
                }]);
            };

            const updateSource = (id, field, value) => {
                setSources(sources.map(src => src.id === id ? { ...src, [field]: value } : src));
            };

            const removeSource = (id) => {
                setSources(sources.filter(src => src.id !== id));
            };

            // Calculate exact requirements per source based on rules
            const getSourceRequirements = (src) => {
                const cab = src.cabinet;
                const qty = src.quantity || 0;
                
                const isSL = CABINETS.SL_SERIES.includes(cab);
                const isStandardTop = CABINETS.STANDARD.includes(cab);
                const isSub = CABINETS.SUBS.includes(cab);
                const isPointSource = CABINETS.POINT_SOURCE.includes(cab);
                const isLineArray = isSL || isStandardTop;
                
                let channelsPerSide = 0;
                let calcText = '';

                // Calculate for a single side first
                if (isSL) {
                    channelsPerSide = src.isAP ? qty * 2 : qty * 1;
                    calcText = src.isAP ? '2 ch / box (AP)' : '1 ch / box (Std)';
                } else if (isStandardTop) {
                    channelsPerSide = src.isAP ? qty * 1 : Math.ceil(qty / 2);
                    calcText = src.isAP ? '1 ch / box (AP)' : '0.5 ch / box (Std)';
                } else if (isSub) {
                    channelsPerSide = cab === 'SL-SUB' ? qty * 2 : qty * 1;
                    calcText = cab === 'SL-SUB' ? '2 ch / sub' : '1 ch / sub';
                } else if (isPointSource) {
                    if (cab === 'M2') {
                        channelsPerSide = src.isLinked ? qty * 1 : qty * 2;
                        calcText = src.isLinked ? '1 ch / box (Linked)' : '2 ch / box (Unlinked)';
                    } else {
                        channelsPerSide = src.isLinked ? Math.ceil(qty / 2) : qty * 1;
                        calcText = src.isLinked ? '0.5 ch / box (Linked)' : '1 ch / box (Unlinked)';
                    }
                }

                // Apply Stereo Multiplier (Independent Arrays logically require duplicated independent channels)
                const stereoMultiplier = (isLineArray && src.isStereo) ? 2 : 1;
                const totalChannels = channelsPerSide * stereoMultiplier;
                
                if (stereoMultiplier === 2) {
                    calcText += ' × 2 (Stereo)';
                }

                const ampsRequired = Math.ceil(totalChannels / 4);

                return { 
                    ampsRequired, 
                    calcText, 
                    isLineArray,
                    isSL,
                    isSub,
                    isPointSource
                };
            };

            // Global Calculate & Allocate Racks (Brute Force Optimization)
            const { totalAmps, optimalAllocation, impossible } = useMemo(() => {
                let d90OnlyAmps = 0;
                let slSeriesAmps = 0;
                let standardAmps = 0;

                sources.forEach(src => {
                    const req = getSourceRequirements(src);
                    const isD90Only = src.cabinet === 'SL-SUB' || src.cabinet === 'M2';
                    const isSLTop = CABINETS.SL_SERIES.includes(src.cabinet);
                    
                    if (isD90Only) {
                        d90OnlyAmps += req.ampsRequired;
                    } else if (isSLTop) {
                        slSeriesAmps += req.ampsRequired;
                    } else {
                        standardAmps += req.ampsRequired;
                    }
                });
                
                const total = d90OnlyAmps + slSeriesAmps + standardAmps;
                
                if (total === 0) return { totalAmps: 0, optimalAllocation: null, impossible: false };

                let bestScore = Infinity;
                let bestAllocation = null;

                // Test all valid combinations of inventory to find the tightest fit
                for (let d4 = 0; d4 <= INVENTORY.d40_6.available; d4++) {
                    for (let d9 = 0; d9 <= INVENTORY.d90_3.available; d9++) {
                        for (let d2 = 0; d2 <= INVENTORY.d20_3.available; d2++) {
                            for (let d1 = 0; d1 <= INVENTORY.d20_1.available; d1++) {
                                
                                const d90Capacity = d9 * INVENTORY.d90_3.capacity;
                                const d40Capacity = d4 * INVENTORY.d40_6.capacity;
                                const d20Capacity = (d2 * INVENTORY.d20_3.capacity) + (d1 * INVENTORY.d20_1.capacity);
                                const totalCapacity = d90Capacity + d40Capacity + d20Capacity;
                                
                                // Rule 1: D90-only boxes (SL-SUB, M2) must have enough D90 capacity
                                if (d90Capacity < d90OnlyAmps) continue;
                                
                                // Rule 2: SL-Series tops can use D40 or remaining D90 capacity. 
                                // (Combined D90 + D40 capacity must cover both D90-only AND SL tops)
                                if ((d90Capacity + d40Capacity) < (d90OnlyAmps + slSeriesAmps)) continue;
                                
                                // Rule 3: Total capacity must cover all boxes
                                if (totalCapacity >= total) {
                                    const waste = totalCapacity - total;
                                    const numRacks = d4 + d9 + d2 + d1;
                                    
                                    // Scoring logic: Minimize wasted channels first, then rack count, tie break on D90
                                    const score = (waste * 1000) + (numRacks * 10) - d9;
                                    
                                    if (score < bestScore) {
                                        bestScore = score;
                                        bestAllocation = { d40_6: d4, d90_3: d9, d20_3: d2, d20_1: d1 };
                                    }
                                }
                            }
                        }
                    }
                }

                return { 
                    totalAmps: total, 
                    optimalAllocation: bestAllocation, 
                    impossible: bestAllocation === null 
                };
            }, [sources]);

            return (
                <div className="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
                    <header className="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-gray-800 pb-6">
                        <div>
                            <h1 className="text-3xl font-bold text-white tracking-tight">d&b Amp Calculator</h1>
                            <p className="text-gray-400 mt-1">Intelligent System Design & Rack Optimization</p>
                        </div>
                        <button 
                            onClick={addSource}
                            className="bg-brand-600 hover:bg-brand-500 text-white px-5 py-2.5 rounded-lg flex items-center gap-2 transition-colors shadow-lg shadow-brand-500/20 font-medium"
                        >
                            <PlusIcon /> Add Source
                        </button>
                    </header>

                    <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                        {sources.map((source) => {
                            const req = getSourceRequirements(source);
                            const numArrays = (req.isLineArray && source.isStereo) ? 2 : 1;
                            
                            return (
                                <div key={source.id} className="bg-gray-800 rounded-xl border border-gray-700 shadow-xl overflow-hidden flex flex-col md:flex-row">
                                    {/* Configuration Side */}
                                    <div className="p-6 flex-1 flex flex-col border-b md:border-b-0 md:border-r border-gray-700">
                                        <div className="flex justify-between items-center mb-6">
                                            <input 
                                                type="text" 
                                                value={source.name}
                                                onChange={(e) => updateSource(source.id, 'name', e.target.value)}
                                                className="bg-transparent text-xl font-bold text-white border-b border-transparent hover:border-gray-600 focus:border-brand-500 focus:outline-none px-1 py-1 w-2/3 transition-colors"
                                                placeholder="Source Name"
                                            />
                                            <button 
                                                onClick={() => removeSource(source.id)}
                                                className="text-gray-500 hover:text-red-400 p-2 rounded-lg hover:bg-red-400/10 transition-colors"
                                                title="Remove Source"
                                            >
                                                <TrashIcon />
                                            </button>
                                        </div>

                                        <div className="space-y-4 flex-1">
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-400 mb-2">Cabinet Type</label>
                                                    <select 
                                                        value={source.cabinet}
                                                        onChange={(e) => updateSource(source.id, 'cabinet', e.target.value)}
                                                        className="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all appearance-none"
                                                    >
                                                        <optgroup label="SL Series">
                                                            {CABINETS.SL_SERIES.map(cab => <option key={cab} value={cab}>{cab}</option>)}
                                                        </optgroup>
                                                        <optgroup label="Standard Tops">
                                                            {CABINETS.STANDARD.map(cab => <option key={cab} value={cab}>{cab}</option>)}
                                                        </optgroup>
                                                        <optgroup label="Subwoofers">
                                                            {CABINETS.SUBS.map(cab => <option key={cab} value={cab}>{cab}</option>)}
                                                        </optgroup>
                                                        <optgroup label="Point Source / Wedges">
                                                            {CABINETS.POINT_SOURCE.map(cab => <option key={cab} value={cab}>{cab}</option>)}
                                                        </optgroup>
                                                    </select>
                                                </div>

                                                <div>
                                                    <label className="block text-sm font-medium text-gray-400 mb-2">Boxes {numArrays > 1 ? '(Per Side)' : ''}</label>
                                                    <input 
                                                        type="number" 
                                                        min="0"
                                                        value={source.quantity}
                                                        onChange={(e) => updateSource(source.id, 'quantity', parseInt(e.target.value) || 0)}
                                                        className="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all"
                                                    />
                                                </div>
                                            </div>

                                            {/* Contextual Toggles based on Cabinet Type */}
                                            {req.isLineArray && (
                                                <div className="flex flex-col gap-2 mt-2">
                                                    <label className="flex items-center gap-3 cursor-pointer group bg-gray-900/50 p-3 rounded-lg border border-gray-700 hover:border-gray-600 transition-colors">
                                                        <div className="relative flex items-center">
                                                            <input 
                                                                type="checkbox" 
                                                                checked={source.isStereo}
                                                                onChange={(e) => updateSource(source.id, 'isStereo', e.target.checked)}
                                                                className="sr-only peer"
                                                            />
                                                            <div className="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-500"></div>
                                                        </div>
                                                        <span className="text-sm font-medium text-gray-300 select-none">Stereo Pair (x2 arrays)</span>
                                                    </label>

                                                    <label className="flex items-center gap-3 cursor-pointer group bg-gray-900/50 p-3 rounded-lg border border-gray-700 hover:border-gray-600 transition-colors">
                                                        <div className="relative flex items-center">
                                                            <input 
                                                                type="checkbox" 
                                                                checked={source.isAP}
                                                                onChange={(e) => updateSource(source.id, 'isAP', e.target.checked)}
                                                                className="sr-only peer"
                                                            />
                                                            <div className="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-500"></div>
                                                        </div>
                                                        <span className="text-sm font-medium text-gray-300 select-none">Enable ArrayProcessing (AP)</span>
                                                    </label>
                                                </div>
                                            )}

                                            {req.isPointSource && (
                                                <label className="flex items-center gap-3 cursor-pointer group mt-2 bg-gray-900/50 p-3 rounded-lg border border-gray-700 hover:border-gray-600 transition-colors">
                                                    <div className="relative flex items-center">
                                                        <input 
                                                            type="checkbox" 
                                                            checked={source.isLinked}
                                                            onChange={(e) => updateSource(source.id, 'isLinked', e.target.checked)}
                                                            className="sr-only peer"
                                                        />
                                                        <div className="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-500"></div>
                                                    </div>
                                                    <span className="text-sm font-medium text-gray-300 select-none">Chain Boxes (Linked)</span>
                                                </label>
                                            )}
                                        </div>

                                        <div className="mt-6 pt-5 border-t border-gray-700">
                                            <div className="text-sm text-gray-400 mb-1">Amps Required</div>
                                            <div className="text-3xl font-bold text-white flex items-baseline gap-2 mb-1">
                                                {req.ampsRequired} <span className="text-sm font-normal text-gray-500">Amps</span>
                                            </div>
                                            <div className="text-sm text-brand-400 font-medium bg-brand-900/20 inline-block px-2 py-1 rounded">
                                                Math: {req.calcText}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Visualizer Side */}
                                    <div className="w-full md:w-64 bg-gray-900 p-6 flex flex-col items-center justify-start min-h-[300px] overflow-x-auto visualizer-scroll">
                                        <div className="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-6 w-full text-center">Array Preview</div>
                                        
                                        <div className="w-full flex-1 flex justify-center gap-6 pb-4 max-h-[350px]">
                                            {source.quantity > 0 ? (
                                                Array.from({ length: numArrays }).map((_, arrIdx) => (
                                                    <div key={arrIdx} className="flex flex-col items-center flex-shrink-0">
                                                        {req.isLineArray && <div className="flybar"></div>}
                                                        
                                                        {Array.from({ length: Math.min(source.quantity, 40) }).map((_, idx) => (
                                                            <div key={idx} className={`cabinet ${req.isSub ? 'sub' : req.isPointSource ? 'point-source' : req.isSL ? 'sl-series' : 'line-array'}`}>
                                                                <div className="cabinet-grille"></div>
                                                            </div>
                                                        ))}
                                                        
                                                        {source.quantity > 40 && (
                                                            <div className="text-xs text-gray-500 mt-3 italic">+ {source.quantity - 40} more</div>
                                                        )}
                                                    </div>
                                                ))
                                            ) : (
                                                <div className="text-sm text-gray-600 italic mt-10">No cabinets</div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                        
                        {sources.length === 0 && (
                            <div className="col-span-full py-24 flex flex-col items-center justify-center border-2 border-dashed border-gray-700 rounded-xl text-gray-500">
                                <p className="text-lg">No sources added.</p>
                                <p className="text-sm mt-1">Click "Add Source" to begin building your system.</p>
                            </div>
                        )}
                    </div>

                    {/* Global System Summary Footer */}
                    <div className="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 shadow-[0_-20px_40px_rgba(0,0,0,0.4)] z-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5">
                            <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6">
                                
                                <div className="flex items-center gap-6">
                                    <div>
                                        <div className="text-sm text-gray-400 font-medium">Total Global Amps</div>
                                        <div className="text-4xl font-bold text-white">{totalAmps}</div>
                                    </div>
                                </div>

                                <div className="bg-gray-900 rounded-lg border border-gray-700 p-4 flex-1 w-full lg:w-auto">
                                    <div className="text-xs text-gray-400 font-semibold uppercase tracking-wider mb-2 flex justify-between">
                                        <span>Recommended Global Rack Allocation</span>
                                    </div>
                                    
                                    {impossible ? (
                                        <div className="text-red-400 text-sm font-medium flex items-center gap-2">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                                            Error: Required amps ({totalAmps}) exceeds complete inventory capacity!
                                        </div>
                                    ) : totalAmps === 0 ? (
                                        <div className="text-gray-500 text-sm">Add cabinets to see rack recommendations.</div>
                                    ) : (
                                        <div className="flex flex-wrap gap-3">
                                            {optimalAllocation && Object.entries(optimalAllocation).map(([key, count]) => {
                                                if (count === 0) return null;
                                                return (
                                                    <div key={key} className="bg-gray-800 border border-gray-600 px-3 py-1.5 rounded-md flex items-center gap-2">
                                                        <span className="text-brand-400 font-bold">{count}x</span>
                                                        <span className="text-sm text-gray-300">{INVENTORY[key].name}</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
